spring.jpa.database=postgresql
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jackson.default-property-inclusion=NON_NULL

spring.jpa.open-in-view=false

server.port=${PORT:8080}

security.jwt.client-id=${CLIENT_ID:ofreceloapp}
security.jwt.client-secret=${CLIENT_SECRET:ofrecelo2020}

# HS256 secret (32+ chars) for JWT signing/validation.
app.security.jwt-secret=${JWT_SECRET:ofrecelo-jwt-secret-key-change-this-please-2026}
app.security.jwt-expiration-seconds=3600